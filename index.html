<body style="font-family: Arial, Helvetica, sans-serif;">
    
    <main style="display: flex;justify-content: center;align-items: center;">
        
        <div style="border-radius: 10px;margin: 2%;border: solid 2px rgba(0,0,0,.2);padding:2%;width:fit-content;text-align: center;">
            <h2>
                Pagar <b style="color:forestgreen;">R$6,00</b> para Cara da cantina
            </h2>
            <hr>
            <img src="https://api.qrserver.com/v1/create-qr-code/?data={'id': 0, 'total_price': 100, 'bought_at': '2026-07-16 12:00', 'items': [{'qty': 6, 'price_unit': 4, 'price_total': 10, 'product_name': 'Risolis'}, {'qty': 6, 'price_unit': 4, 'price_total': 10, 'product_name': 'Risolis'}]}&size=200x200&charset-source=UTF-8" alt="" title="" />
            <hr>
            <h1 id="timer">

            </h1>
        </div>
    </main>
<script>
    const timerE = document.getElementById('timer');
    let timer = 10000;
    setInterval(() => {
        timer--;
        timerE.innerHTML = `Tempo para finalizar sua compra:<br> ${timer}`;
    }, 1000);
</script>
</body>
